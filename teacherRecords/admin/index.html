<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../CSS/admin.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="welcome">
            <h1>Welcome, Admin</h1>
            <button id="logoutBtn">Logout</button>
        </div>
    </header>

    <!-- Admin Table Section -->
    <div class="table-section">
        <h2>Teachers</h2>
        <table id="teachersTable">
            <thead>
                <tr>
                    <th>Teacher ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Teacher data will be dynamically populated -->
            </tbody>
        </table>
    </div>

    <!-- Edit Teacher Modal -->
    <div id="editTeacherModal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <h2>Edit Teacher Details</h2>
            <form id="editTeacherForm">
                <label for="teacherName">Name:</label>
                <input type="text" id="teacherName" name="teacherName" required><br><br>
                <label for="teacherDept">Department:</label>
                <input type="text" id="teacherDept" name="teacherDept" required><br><br>
                <button type="submit">Save</button>
            </form>
        </div>
    </div>

    <!-- Schedule Class Modal -->
    <div id="scheduleClassModal" class="modal">
        <div class="modal-content">
            <span id="closeScheduleModal" class="close">&times;</span>
            <h2>Schedule Class for Teacher</h2>
            <form id="scheduleClassForm">
                <label for="classID">Class ID:</label>
                <input type="text" id="classID" name="classID" required><br><br>
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required><br><br>
                <label for="timeStart">Start Time:</label>
                <input type="time" id="timeStart" name="timeStart" required><br><br>
                <label for="timeEnd">End Time:</label>
                <input type="time" id="timeEnd" name="timeEnd" required><br><br>
                <label for="roomNo">Room No:</label>
                <input type="text" id="roomNo" name="roomNo" required><br><br>
                <label for="course">Course:</label>
                <input type="text" id="course" name="course" required><br><br>
                <label for="weekNo">Week No:</label>
                <input type="number" id="weekNo" name="weekNo" required><br><br>
                <button type="submit">Schedule Class</button>
            </form>
        </div>
    </div>


    <script src="https://www.gstatic.com/firebasejs/8.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.7.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.7.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.7.1/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.7.1/firebase-auth.js"></script>
    <script src="../JS/linkRedirect.js"></script>
    <script src="../JS/admin.js"></script>
</body>
</html>
