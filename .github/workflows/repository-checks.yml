name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maintenance:
    name: Legacy application integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: teacherRecords
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: teacherRecords/package-lock.json

      - name: Verify locked dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Verify the static application entry points
        shell: bash
        run: |
          required=(
            "../index.html"
            "login/index.html"
            "admin/index.html"
            "JS/login.js"
            "JS/admin.js"
          )
          for entry in "${required[@]}"; do
            test -s "$entry" || {
              echo "Required legacy application entry is missing or empty: $entry" >&2
              exit 1
            }
          done

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.html' '*.css' '*.js'; then
            echo "Unresolved merge markers found in the maintained application." >&2
            exit 1
          fi
